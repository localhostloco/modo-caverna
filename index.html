<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Modo Caverna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única de leitura (máx. 760px), cabeçalho com contagem de dias em riscos de parede de caverna, abas fixas no topo. */
:root{
  --bg:#E8E9E4; --surface:#F6F6F2; --ink:#1D211F; --muted:#5B635E; --line:#CBCFC8;
  --accent:#A3600C; --accent-ink:#FFFFFF; --accent-soft:#F1E3CC;
  --good:#3A7550; --warn:#A2441C;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131514; --surface:#1C1F1E; --ink:#E7E5DD; --muted:#9BA19B; --line:#2F3432;
  --accent:#E3A24C; --accent-ink:#1B1309; --accent-soft:#3A2C18;
  --good:#7FBA8E; --warn:#E78763; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131514; --surface:#1C1F1E; --ink:#E7E5DD; --muted:#9BA19B; --line:#2F3432;
  --accent:#E3A24C; --accent-ink:#1B1309; --accent-soft:#3A2C18;
  --good:#7FBA8E; --warn:#E78763; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font:800 1.5rem/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
h3{font:600 1rem/1.3 var(--f-body)}
p{margin:0}
.eyebrow{font:500 .7rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Cabeçalho */
.topo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.topo h1{font:800 clamp(2.6rem,9vw,4.2rem)/.9 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin-top:6px}
.contador{text-align:right}
.contador .num{font:800 2.6rem/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.contador .num small{font-size:1.2rem;color:var(--muted)}
.contador .sub{display:block;font:500 .78rem/1.3 var(--f-mono);color:var(--muted);margin-top:4px}
.tally{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:18px}
.semana{display:flex;gap:3px;align-items:flex-end}
.risco{width:5px;height:26px;border-radius:2px;background:var(--line);position:relative}
.risco.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.risco.hoje{outline:2px solid var(--ink);outline-offset:2px}
.periodo{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font:500 .78rem/1.4 var(--f-mono);color:var(--muted)}
.status::before{content:"● ";color:var(--good)}
.lnk{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.lnk:hover{color:var(--ink)}

/* Abas */
nav.abas{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:18px;padding-block:8px;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.abas button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:600 .9rem/1 var(--f-body);padding:10px 12px;border-radius:8px;cursor:pointer}
nav.abas button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.abas button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{display:grid;gap:32px;margin-top:24px}
section{display:grid;gap:14px}
.intro{color:var(--muted);max-width:62ch}

/* Faixa de exemplo */
.exemplo{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-top:18px}
.exemplo p{min-width:0;flex:1 1 260px}

/* Botões e campos */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .85rem/1 var(--f-body);padding:10px 14px;border-radius:8px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.x{padding:6px 10px;font-size:.78rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.campo{display:grid;gap:5px;min-width:0}
.campo.largo{grid-column:1/-1}
.campo>span{font:500 .72rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=time],input[type=date],input[type=number],select,textarea{width:100%;box-sizing:border-box;font:400 .95rem/1.4 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
input[type=time],input[type=number]{font-family:var(--f-mono)}
textarea{min-height:84px;resize:vertical}
.check-inline{display:flex;gap:8px;align-items:center;font-size:.9rem}

/* Cartões (metas e ações) */
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.cartao-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font:500 .72rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* Chips de área */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 .9rem/1 var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.aviso{font-size:.85rem;color:var(--warn)}
.ok{font-size:.85rem;color:var(--good)}

/* Hoje */
.dianav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dianav .meio{text-align:center;display:grid;gap:2px}
.dianav strong{font:800 1.6rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.placar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.placar .big{font:800 3.4rem/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.barra{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
ul.lista{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.item input{position:absolute;opacity:0;pointer-events:none}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center}
.item input:checked + .box{background:var(--accent);border-color:var(--accent)}
.item input:checked + .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.item input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.item .txt{min-width:0}
.item .txt b{font-weight:600;display:block}
.item .txt small{color:var(--muted);font-size:.84rem}
.item.feito .txt b{text-decoration:line-through;text-decoration-color:var(--muted)}
.item .hora{font:500 .85rem/1 var(--f-mono);color:var(--muted)}
.vazio{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:.9rem}

/* Rotina */
.nota{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--muted);font-size:.9rem;max-width:62ch}
ol.linha{list-style:none;margin:0;padding:0;display:grid}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev input.ev-h{width:7.6em;font:500 .95rem/1.2 var(--f-mono);font-variant-numeric:tabular-nums;padding:8px}
.ev span.ev-h{display:block;width:7.6em;box-sizing:border-box;padding:9px 8px;font:500 .95rem/1.2 var(--f-mono);color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.ev .t{min-width:0;display:grid;gap:6px}
.ev-cab{display:flex;align-items:center;gap:8px;min-width:0;min-height:36px}
.ev-cab b{font-weight:600}
.ev-cab .pill{margin:0;flex:none}
.ev-cab input.ev-txt{flex:1;min-width:0;font-weight:600}
.ev-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ev-ctl input.ev-txt{flex:1 1 100%;width:100%;min-width:0}
.ev-dur{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;color:var(--muted)}
.ev-dur input[type=number]{width:5.4em;padding:8px}
.ev select.ev-sel{width:auto;padding:8px}
.ev .t small{color:var(--muted);font-size:.84rem;display:block}
.ev .t .aviso{display:block}
.dias{display:inline-flex;gap:2px;flex-wrap:wrap}
.dia{width:28px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 .78rem/1 var(--f-mono);cursor:pointer;padding:0}
.dia[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ev-lado{display:grid;gap:4px;justify-items:end}
.pill.comp{background:var(--ink);color:var(--bg)}
.pill{display:inline-block;font:500 .66rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.pill.base{background:var(--line);color:var(--ink)}
.pill.acao{background:var(--accent);color:var(--accent-ink)}
.pill.apoio{box-shadow:inset 0 0 0 1px var(--muted);color:var(--muted)}
a.gcal{font:600 .78rem/1 var(--f-body);color:var(--accent);text-decoration:none;white-space:nowrap;padding:6px 0}
a.gcal:hover{text-decoration:underline}

/* Revisão */
.grade-wrap{overflow-x:auto}
.grade{display:grid;grid-template-columns:auto repeat(7,minmax(26px,1fr)) auto;gap:4px;align-items:center;min-width:330px}
.grade .lbl{font:500 .75rem/1.2 var(--f-mono);color:var(--muted);padding-right:6px;white-space:nowrap}
.grade .cab{font:500 .68rem/1 var(--f-mono);color:var(--muted);text-align:center;text-transform:uppercase}
.cel{height:24px;border-radius:4px;background:var(--line)}
.cel.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cel.hoje{outline:2px solid var(--ink);outline-offset:1px}
.grade .pct{font:500 .8rem/1 var(--f-mono);text-align:right;padding-left:6px;font-variant-numeric:tabular-nums}
.grade .atual{color:var(--accent);font-weight:600}
details.sem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sem summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;list-style:none}
details.sem summary::-webkit-details-marker{display:none}
details.sem summary b{font-weight:600}
details.sem .corpo{padding:0 14px 14px;display:grid;gap:12px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font:500 .72rem/1 var(--f-mono);color:var(--muted);align-items:center}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* Guia */
ol.passos{list-style:none;margin:0;padding:0;display:grid}
.passo{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.passo:last-child{border-bottom:0}
.passo .n{font:800 2.2rem/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.passo .c{display:grid;gap:8px;min-width:0;max-width:62ch}
.passo ul,.guia-lista{margin:0;padding-left:18px;color:var(--muted);display:grid;gap:4px}
.passo .row{margin-top:2px}
.ui-txt{font-weight:600;color:var(--ink)}
.mini-tally{display:inline-flex;gap:3px;vertical-align:-3px;margin-right:6px}
.mini-tally i{width:4px;height:14px;border-radius:2px;background:var(--line)}

/* Exportação */
.exportar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.exportar .row label{display:flex;gap:6px;align-items:center;font-size:.9rem;padding:6px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer}
#exp-msg:empty{display:none}
#exp-txt{font-family:var(--f-mono);font-size:.75rem;min-height:140px}

/* Auditoria */
.exportar h3{font:800 1.05rem/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
ul.probs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.probs li{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start}
ul.probs li>div{min-width:0}
ul.probs small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
ul.probs .pill{text-align:center;margin:2px 0 0}
.pill.g-alta{background:var(--warn);color:var(--bg)}
.pill.g-media{background:var(--accent-soft);color:var(--ink)}
.pill.g-baixa{box-shadow:inset 0 0 0 1px var(--muted);color:var(--muted)}
.item input:disabled + .box{opacity:.4}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:520px){.contador{text-align:left}.ev{grid-template-columns:auto 1fr}.ev-lado{grid-column:1/-1;display:flex;justify-content:flex-end;gap:14px;align-items:center}}
</style>

<div class="wrap">
  <div id="topo"></div>
  <div id="faixa"></div>
  <nav class="abas" role="tablist" id="abas">
    <button role="tab" data-tab="hoje">Hoje</button>
    <button role="tab" data-tab="plano">Plano</button>
    <button role="tab" data-tab="base">Base</button>
    <button role="tab" data-tab="rotina">Rotina</button>
    <button role="tab" data-tab="revisao">Revisão</button>
    <button role="tab" data-tab="guia">Guia</button>
  </nav>
  <main id="conteudo"></main>
</div>

<script>
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_LONGO=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const BYDAY=['SU','MO','TU','WE','TH','FR','SA'];
const AREAS=['Finanças','Carreira','Saúde','Relacionamentos','Espiritualidade'];
const LS='modo-caverna-v1';
const CICLO=84;

const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>ymd(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDias=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const mins=h=>{if(!h)return 0;const[a,b]=h.split(':').map(Number);return a*60+(b||0)};
const hhmm=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const durTxt=m=>{const h=Math.floor(m/60),r=m%60;return h?(h+'h'+(r?pad(r):'')):r+' min'};
const fmt=(s,o)=>parse(s).toLocaleDateString('pt-BR',o||{day:'numeric',month:'short'}).replace('.','');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function base0(){return{dormir:'22:30',acordar:'06:00',habilidade:'',estudoHora:'07:30',estudoDur:30,movAtiv:'',movHora:'18:30',movDur:30}}
function blocos0(){return{reservaManha:'11:30',reservaTarde:'17:30',reservaDur:30,fugaDia:0,fugaHora:'09:00',fugaDur:180,fugaAtiv:''}}
function exemplo(){
  const m1=uid(),m2=uid();
  return{v:1,exemplo:true,inicio:hoje(),
    areas:['Carreira','Saúde'],areasExtra:[],
    visao:'Daqui a 3 anos: trabalhar em um time internacional, com inglês fluente e condicionamento para correr uma meia maratona.',
    metas:[
      {id:m1,texto:'Passar na certificação AWS Solutions Architect – Associate',medida:'Prova aprovada',alvo:'Até 20 de dezembro',soDeMim:true},
      {id:m2,texto:'Correr 5 km abaixo de 28 minutos',medida:'Tempo no app de corrida',alvo:'< 28:00',soDeMim:true}],
    acoes:[
      {id:uid(),meta:m1,texto:'Bloco AWS: aula + laboratório prático',freq:'diaria',dia:1,hora:'06:30',dur:60},
      {id:uid(),meta:m1,texto:'Simulado completo de prova',freq:'semanal',dia:6,hora:'08:00',dur:130},
      {id:uid(),meta:m2,texto:'Treino de tiros (intervalado)',freq:'semanal',dia:4,hora:'18:30',dur:45}],
    recompensa:'Fim de semana na serra, sem notebook.',
    base:{dormir:'22:30',acordar:'06:00',habilidade:'Inglês (conversação)',estudoHora:'07:40',estudoDur:30,movAtiv:'Corrida ou musculação',movHora:'18:30',movDur:45},
    blocos:{reservaManha:'11:30',reservaTarde:'17:30',reservaDur:30,fugaDia:0,fugaHora:'09:00',fugaDur:180,fugaAtiv:'Trilha ou parque, sem telas'},
    compromissos:[{id:uid(),titulo:'Trabalho',hora:'09:00',dur:540,dias:[1,2,3,4,5]}],
    log:{},revisoes:{}};
}
function vazio(){return{v:1,exemplo:false,inicio:hoje(),areas:[],areasExtra:[],visao:'',metas:[],acoes:[],recompensa:'',base:base0(),blocos:blocos0(),compromissos:[],log:{},revisoes:{},auditoria:null}}
function normalizar(s){
  const d=vazio();if(!s||typeof s!=='object')return exemplo();
  const o=Object.assign(d,s);o.base=Object.assign(base0(),s.base||{});o.blocos=Object.assign(blocos0(),s.blocos||{});
  ['areas','areasExtra','metas','acoes','compromissos'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  o.compromissos=o.compromissos.filter(c=>c&&typeof c==='object').map(c=>({id:c.id||uid(),titulo:String(c.titulo||''),hora:c.hora||'09:00',dur:+c.dur||60,dias:Array.isArray(c.dias)?c.dias.map(Number).filter(d=>d>=0&&d<=6):[]}));
  if(!o.log||typeof o.log!=='object')o.log={};if(!o.revisoes||typeof o.revisoes!=='object')o.revisoes={};
  const au=o.auditoria;if(!au||typeof au!=='object'||!Array.isArray(au.problemas)||!Array.isArray(au.perguntas))o.auditoria=null;
  return o;
}

/* ---------- Estado e gravação ---------- */
let state,ref=null,salvando=false,pendente=false,timer=null,statusTxt='Salvo neste aparelho';
const ui={aba:'hoje',dia:null,exp:{base:true,acao:true,apoio:true,comp:false},ia:{foco:'auditoria',hist:true},imp:null,respTxt:'',aplicado:null,desfazer:null,bk:null,bkTxt:'',bkFeito:false,bkDesfazer:null,bkOk:''};
function lerLocal(){try{const r=localStorage.getItem(LS);return r?normalizar(JSON.parse(r)):null}catch(e){return null}}
function gravarLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function setStatus(t){statusTxt=t;const el=document.getElementById('status');if(el)el.textContent=t}
function agendar(){gravarLocal();if(!ref){setStatus('Salvo neste aparelho');return}setStatus('Salvando…');clearTimeout(timer);timer=setTimeout(persistir,700)}
async function persistir(){
  if(!ref)return;
  if(salvando){pendente=true;return}
  salvando=true;
  const corpo={state:JSON.parse(JSON.stringify(state)),atualizado:new Date().toISOString()};
  try{await ref.set(corpo);setStatus('Salvo na sua conta')}
  catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await ref.set(corpo);setStatus('Salvo na sua conta')}catch(_){setStatus('Sem conexão · salvo neste aparelho')}}
    else{setStatus('Não deu para salvar na conta · salvo neste aparelho')}
  }
  salvando=false;if(pendente){pendente=false;persistir()}
}

/* ---------- Ciclo ---------- */
const fimCiclo=()=>addDias(state.inicio,CICLO-1);
function semanaDe(d){const n=diff(state.inicio,d);return n<0||n>=CICLO?0:Math.floor(n/7)+1}
function itensDo(d){
  const b=state.base,dow=parse(d).getDay();
  const it=[
    {k:'sono',t:'Sono de 7h ou mais',s:`Deitar ${b.dormir} · acordar ${b.acordar}`,h:b.dormir,ord:mins(b.dormir)},
    {k:'celular',t:'Celular fora nas bordas do dia',s:`Livre só após ${hhmm(mins(b.acordar)+30)} · desligar às ${hhmm(mins(b.dormir)-30)}`,h:'',ord:mins(b.acordar)},
    {k:'estudo',t:'Estudo ativo'+(b.habilidade?': '+b.habilidade:''),s:`${durTxt(+b.estudoDur||0)} travados na agenda`,h:b.estudoHora,ord:mins(b.estudoHora)},
    {k:'movimento',t:'Movimento'+(b.movAtiv?': '+b.movAtiv:''),s:`${durTxt(+b.movDur||0)} de atividade física`,h:b.movHora,ord:mins(b.movHora)}];
  const ac=state.acoes.filter(a=>a.texto&&(a.freq==='diaria'||+a.dia===dow)).map(a=>{
    const m=state.metas.find(x=>x.id===a.meta);
    return{k:'a:'+a.id,t:a.texto,s:(m&&m.texto?m.texto:'Sem meta vinculada')+' · '+durTxt(+a.dur||0),h:a.hora,ord:mins(a.hora),acao:true}});
  const acordar=mins(b.acordar),rel=x=>(x.ord-acordar+1440)%1440;
  return{base:it,acoes:ac.sort((x,y)=>rel(x)-rel(y))};
}
function scoreDia(d){const{base,acoes}=itensDo(d),all=base.concat(acoes),l=state.log[d]||{};const f=all.filter(i=>l[i.k]).length;return{f,t:all.length,p:all.length?f/all.length:0}}
function scoreSemana(w){
  const h=hoje();let soma=0,n=0;
  for(let i=0;i<7;i++){const d=addDias(state.inicio,(w-1)*7+i);if(d>h)break;soma+=scoreDia(d).p;n++}
  return n?soma/n:null;
}
const pct=p=>p==null?'—':Math.round(p*100)+'%';
const corScore=p=>`color-mix(in oklab, var(--accent) ${Math.round(18+p*82)}%, var(--line))`;

/* ---------- Google Agenda ---------- */
function gcal(t){
  const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'America/Sao_Paulo';
  let s=state.inicio>hoje()?state.inicio:hoje();if(s>fimCiclo())s=state.inicio;
  if(t.dias){let g=0;while(!t.dias.includes(parse(s).getDay())&&g<7){s=addDias(s,1);g++}}
  const ini=mins(t.hora),fim=ini+(+t.dur||30);
  const d1=s.replace(/-/g,'')+'T'+hhmm(ini).replace(':','')+'00';
  const d2=(fim>=1440?addDias(s,1):s).replace(/-/g,'')+'T'+hhmm(fim).replace(':','')+'00';
  const until=fimCiclo().replace(/-/g,'')+'T235959';
  const rr=t.dias?`RRULE:FREQ=WEEKLY;BYDAY=${t.dias.map(d=>BYDAY[d]).join(',')};UNTIL=${until}`:`RRULE:FREQ=DAILY;UNTIL=${until}`;
  const e=encodeURIComponent;
  return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+e('[Caverna] '+t.titulo)+'&dates='+d1+'/'+d2+'&ctz='+e(tz)+'&recur='+e(rr)+'&details='+e((t.detalhes||'')+'\nCiclo Modo Caverna até '+fmt(fimCiclo(),{day:'numeric',month:'long',year:'numeric'}));
}
const linkCal=t=>`<a class="gcal" href="${esc(gcal(t))}" target="_blank" rel="noopener">Google Agenda ↗</a>`;

/* ---------- Topo ---------- */
function renderTopo(){
  const h=hoje(),n=diff(state.inicio,h),w=semanaDe(h),fim=fimCiclo();
  let num,sub;
  if(n<0){num=`S<b>00</b><small>/12</small>`;sub=`começa em ${-n} dia${-n>1?'s':''}`}
  else if(n>=CICLO){num=`<small>Ciclo</small> fim`;sub='ciclo encerrado · hora da recompensa?'}
  else{num=`S${pad(w)}<small>/12</small>`;sub=`dia ${n+1} de ${CICLO} · faltam ${CICLO-n-1}`}
  let tally='';
  for(let s=0;s<12;s++){
    tally+='<div class="semana" aria-hidden="true">';
    for(let i=0;i<7;i++){
      const d=addDias(state.inicio,s*7+i);
      if(d>h)tally+=`<span class="risco fut${d===h?' hoje':''}"></span>`;
      else{const p=scoreDia(d).p;tally+=`<span class="risco${d===h?' hoje':''}" style="${p>0?'background:'+corScore(p):''}"></span>`}
    }
    tally+='</div>';
  }
  document.getElementById('topo').innerHTML=`
  <header class="topo">
    <div><span class="eyebrow">Ciclo de 12 semanas</span><h1>Modo Caverna</h1></div>
    <div class="contador"><span class="num">${num}</span><span class="sub">${sub}</span></div>
  </header>
  <div class="tally" title="Cada risco é um dia do ciclo; quanto mais forte, mais você cumpriu">${tally}</div>
  <p class="periodo"><span>${fmt(state.inicio,{day:'numeric',month:'short',year:'numeric'})} → ${fmt(fim,{day:'numeric',month:'short',year:'numeric'})}</span><span class="status" id="status">${esc(statusTxt)}</span><button class="lnk" data-tab="guia" data-goto="backup">Usar em outro aparelho</button></p>`;
  document.getElementById('faixa').innerHTML=state.exemplo?`
  <div class="exemplo"><p><b>Plano de exemplo.</b> Os dados abaixo mostram como a página funciona. Comece do zero ou edite a partir dele.</p>
  <div class="row"><button class="btn ghost" data-tab="guia">Como usar</button><button class="btn" data-act="zerar">Começar do zero</button><button class="btn pri" data-act="manter">Editar a partir dele</button></div></div>`:'';
}

const expInicio=()=>{const h=hoje();return state.inicio>h?state.inicio:(h>fimCiclo()?state.inicio:h)};

function contarExp(){
  const evs=expEventos(),ini=expInicio(),n=diff(ini,fimCiclo())+1;let c=0;
  for(let i=0;i<n;i++){const dow=parse(addDias(ini,i)).getDay();evs.forEach(e=>{if(!e.dias||e.dias.includes(dow))c++})}
  return c;
}
function gerarCsv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const data=s=>{const[y,m,d]=s.split('-');return m+'/'+d+'/'+y};
  const hora=m=>{m=((m%1440)+1440)%1440;let h=Math.floor(m/60);const ap=h<12?'AM':'PM';h=h%12||12;return pad(h)+':'+pad(m%60)+' '+ap};
  const linhas=['Subject,Start Date,Start Time,End Date,End Time,All Day Event,Description,Private'];
  const evs=expEventos(),ini=expInicio(),n=diff(ini,fimCiclo())+1;
  for(let i=0;i<n;i++){
    const d=addDias(ini,i),dow=parse(d).getDay();
    evs.forEach(e=>{
      if(e.dias&&!e.dias.includes(dow))return;
      const a=mins(e.h),f=a+e.dur;
      linhas.push([q('[Caverna] '+e.titulo),data(d),hora(a),data(f>=1440?addDias(d,1):d),hora(f),'False',q(e.det),'True'].join(','));
    });
  }
  return linhas.join('\r\n')+'\r\n';
}
function gerarIcs(){
  const escI=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const dt=(s,m)=>s.replace(/-/g,'')+'T'+hhmm(m).replace(':','')+'00';
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const until=fimCiclo().replace(/-/g,'')+'T235959';
  const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Modo Caverna//PT-BR','CALSCALE:GREGORIAN','X-WR-CALNAME:Modo Caverna'];
  expEventos().forEach((e,i)=>{
    let s=expInicio();
    if(e.dias){let g=0;while(!e.dias.includes(parse(s).getDay())&&g<7){s=addDias(s,1);g++}}
    const a=mins(e.h),f=a+e.dur;
    out.push('BEGIN:VEVENT','UID:caverna-'+stamp+'-'+i+'@modo-caverna','DTSTAMP:'+stamp,
      'DTSTART:'+dt(s,a),'DTEND:'+dt(f>=1440?addDias(s,1):s,f),
      'RRULE:'+(e.dias?'FREQ=WEEKLY;BYDAY='+e.dias.map(d=>BYDAY[d]).join(','):'FREQ=DAILY')+';UNTIL='+until,
      'SUMMARY:'+escI('[Caverna] '+e.titulo),'DESCRIPTION:'+escI(e.det),'END:VEVENT');
  });
  out.push('END:VCALENDAR');
  return out.join('\r\n')+'\r\n';
}

/* Baixa um arquivo: usa o download do Claude quando existe; fora dele, o download normal do navegador.
   Retorna 'ok', 'declined', 'rate_limited' ou 'falhou' (aí quem chamou mostra o texto para copiar). */
async function baixar(nome,texto,tipo){
  if(window.claude){
    let dl=null;try{dl=window.claude.use?await window.claude.use('downloads'):null}catch(_){}
    if(!dl)return'falhou';
    try{await dl.save({filename:nome,data:texto});return'ok'}
    catch(e){const c=e&&e.code;return c==='declined'||c==='rate_limited'?c:'falhou'}
  }
  try{
    const u=URL.createObjectURL(new Blob([texto],{type:tipo})),a=document.createElement('a');
    a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
    return'ok';
  }catch(_){return'falhou'}
}
const MSG_DL={declined:'Download cancelado.',rate_limited:'Já há um download aguardando confirmação. Responda a ele e tente de novo.'};

  if(r==='ok')msg.textContent='Arquivo modo-caverna.csv salvo. Agora importe pelo Google Agenda no computador.';
  else if(MSG_DL[r])msg.textContent=MSG_DL[r];
  else mostrarTexto(csv,'Não foi possível baixar o arquivo aqui. Copie o texto abaixo, cole num editor e salve como modo-caverna.csv.');
}

/* Aceita o arquivo de backup ou um estado solto; devolve {state, exportado} ou lança a mensagem de erro */
function lerBackup(txt){
  let o;try{o=JSON.parse(String(txt).trim())}catch(e){throw'Não consegui ler o backup. Confira se copiou o texto inteiro, do primeiro { ao último }.'}
  if(!o||typeof o!=='object'||Array.isArray(o))throw'Isso não parece um backup do Modo Caverna.';
  let s=o,em=null;
  if(o.app==='modo-caverna'){
    if(+o.formato>1)throw'Este backup foi feito por uma versão mais nova da página. Recarregue a página e tente de novo.';
    s=o.state;em=typeof o.exportado==='string'?o.exportado:null;
  }
  if(!s||typeof s!=='object'||typeof s.inicio!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.inicio)||!Array.isArray(s.metas)||!Array.isArray(s.acoes))throw'Isso não parece um backup do Modo Caverna.';
  const st=normalizar(s);
  ['metas','acoes'].forEach(k=>{st[k]=st[k].filter(x=>x&&typeof x==='object')});
  return{state:st,exportado:em};
}

const ROTULO_BASE={sono:'Sono de 7h ou mais',celular:'Celular fora nas bordas do dia',estudo:'Estudo ativo',movimento:'Movimento físico'};
const intervalo=e=>`${e.h}–${hhmm(mins(e.h)+e.dur)}`;
const tx=v=>String(v??'').trim();

function conflitos(){
  const ev=eventos().filter(e=>e.h),out=[];
  const juntos=(a,b)=>(!a.dias||!b.dias||a.dias.some(d=>b.dias.includes(d)))&&!((a.util&&b.tipo==='comp')||(b.util&&a.tipo==='comp'));
  for(let i=0;i<ev.length;i++)for(let j=i+1;j<ev.length;j++){
    const a=ev[i],b=ev[j];if(!juntos(a,b))continue;
    const a0=mins(a.h),a1=a0+a.dur,b0=mins(b.h),b1=b0+b.dur;
    if([-1440,0,1440].some(s=>a0<b1+s&&b0+s<a1))out.push(`"${a.titulo}" (${intervalo(a)}) e "${b.titulo}" (${intervalo(b)})`);
  }
  return out;
}
function alertas(){
  const A=[],b=state.base,sono=(mins(b.acordar)-mins(b.dormir)+1440)%1440;
  if(!state.areas.length)A.push('Nenhuma área em foco selecionada.');
  else if(state.areas.length>2)A.push(`${state.areas.length} áreas em foco; o método recomenda 1 ou 2.`);
  if(!tx(state.visao))A.push('Visão de futuro em branco.');
  if(!state.metas.some(m=>tx(m.texto)))A.push('Nenhuma meta definida.');
  state.metas.forEach((m,i)=>{
    if(!tx(m.texto))return;
    if(!m.soDeMim)A.push(`Meta ${i+1} marcada como NÃO dependendo só de mim.`);
    if(!tx(m.medida))A.push(`Meta ${i+1} sem forma de medir.`);
    if(!tx(m.alvo))A.push(`Meta ${i+1} sem alvo ou prazo.`);
    if(!state.acoes.some(a=>a.meta===m.id&&tx(a.texto)))A.push(`Meta ${i+1} sem nenhuma ação assimétrica vinculada.`);
  });
  state.acoes.filter(a=>tx(a.texto)&&!state.metas.some(m=>m.id===a.meta)).forEach(a=>A.push(`Ação "${a.texto}" sem meta vinculada.`));
  eventos().filter(e=>e.tarde).forEach(e=>A.push(`Ação "${e.titulo}" às ${e.h}, fora do pico de energia da manhã.`));
  if(sono<420)A.push(`Janela de sono de ${durTxt(sono)}, abaixo do mínimo de 7h.`);
  if((+b.movDur||0)<30)A.push(`Movimento de ${b.movDur||0} min, abaixo do mínimo de 30 min.`);
  if(!tx(b.habilidade))A.push('Nenhuma habilidade definida para o estudo ativo.');
  if(!tx(state.recompensa))A.push('Recompensa do fim do ciclo em branco.');
  conflitos().forEach(c=>A.push('Conflito de horário: '+c+'.'));
  return A;
}
function aderencia(){
  const h=hoje(),fim=fimCiclo(),ult=h<fim?h:fim,r={};let dias=0;
  if(ult<state.inicio)return{dias,r};
  for(let d=state.inicio;d<=ult;d=addDias(d,1)){
    dias++;const{base,acoes}=itensDo(d),l=state.log[d]||{};
    base.concat(acoes).forEach(i=>{const o=r[i.k]||(r[i.k]={t:0,f:0});o.t++;if(l[i.k])o.f++});
  }
  return{dias,r};
}

}

/* ----- Importação da resposta ----- */
const CAMPOS={
  meta:{texto:'s',medida:'s',alvo:'s',soDeMim:'b'},
  acao:{texto:'s',meta:'meta',freq:'freq',dia:'dia',hora:'t',dur:'n'},
  base:{dormir:'t',acordar:'t',habilidade:'s',estudoHora:'t',estudoDur:'n',movAtiv:'s',movHora:'t',movDur:'n'},
  blocos:{reservaManha:'t',reservaTarde:'t',reservaDur:'n',fugaDia:'dia',fugaHora:'t',fugaDur:'n',fugaAtiv:'s'}};
const NOME_CAMPO={texto:'texto',medida:'como medir',alvo:'alvo',soDeMim:'depende só de mim',meta:'meta',freq:'frequência',dia:'dia',hora:'horário',dur:'minutos',
  dormir:'dormir',acordar:'acordar',habilidade:'habilidade',estudoHora:'horário do estudo',estudoDur:'minutos de estudo',movAtiv:'atividade física',movHora:'horário do movimento',movDur:'minutos de movimento',
  reservaManha:'reserva da manhã',reservaTarde:'reserva do fim do dia',reservaDur:'minutos de reserva',fugaDia:'dia da fuga',fugaHora:'início da fuga',fugaDur:'minutos de fuga',fugaAtiv:'atividade da fuga'};
const OPS={definir_areas:1,definir_visao:1,definir_recompensa:1,editar_meta:1,nova_meta:1,remover_meta:1,editar_acao:1,nova_acao:1,remover_acao:1,editar_base:1,editar_blocos:1};

function converter(tipo,v,refs){
  if(tipo==='s'){if(typeof v!=='string'&&typeof v!=='number')throw'texto inválido';return String(v).trim().slice(0,600)}
  if(tipo==='b'){if(typeof v==='boolean')return v;if(v==='true'||v==='sim')return true;if(v==='false'||v==='não'||v==='nao')return false;throw'valor sim/não inválido'}
  if(tipo==='t'){const m=/^(\d{1,2}):(\d{2})$/.exec(String(v).trim());if(!m||+m[1]>23||+m[2]>59)throw`horário "${v}" inválido`;return pad(+m[1])+':'+m[2]}
  if(tipo==='n'){const n=Math.round(Number(v));if(!isFinite(n)||n<5||n>900)throw`minutos "${v}" fora do intervalo`;return n}
  if(tipo==='dia'){
    if(typeof v==='string'&&isNaN(+v)){const s=v.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').slice(0,3);const i=['dom','seg','ter','qua','qui','sex','sab'].indexOf(s);if(i<0)throw`dia "${v}" inválido`;return i}
    const n=Number(v);if(!Number.isInteger(n)||n<0||n>6)throw`dia "${v}" inválido`;return n}
  if(tipo==='freq'){const s=String(v).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');if(s==='diaria'||s==='semanal')return s;throw`frequência "${v}" inválida`}
  if(tipo==='meta'){if(v==null||v==='')return'';const id=refs[v]||v;if(!state.metas.some(m=>m.id===id))throw`meta "${v}" não existe`;return id}
}
function camposDe(op,grupo,refs){
  const src=Object.assign({},op,op.campos&&typeof op.campos==='object'?op.campos:{}),out={};
  Object.keys(CAMPOS[grupo]).forEach(k=>{if(src[k]!==undefined)out[k]=converter(CAMPOS[grupo][k],src[k],refs)});
  return out;
}
function rotMeta(id,refs){
  const r=Object.keys(refs||{}).find(k=>refs[k]===id);
  const i=state.metas.findIndex(m=>m.id===id);
  return i>=0?`Meta ${i+1}`:(r?`nova meta "${r}"`:id?`meta "${id}"`:'sem meta');
}
function valorTxt(k,v){
  if(k==='dia'||k==='fugaDia'){const n=Number(v);return DIAS_LONGO[n]||String(v)}
  if(k==='freq')return v==='semanal'?'semanal':'diária';
  if(typeof v==='boolean')return v?'sim':'não';
  if(k==='meta')return state.metas.some(m=>m.id===v)?rotMeta(v):`"${v}"`;
  return typeof v==='string'?`"${v}"`:String(v);
}
function listaCampos(o,grupo){
  const src=Object.assign({},o,o.campos&&typeof o.campos==='object'?o.campos:{});
  return Object.keys(CAMPOS[grupo]).filter(k=>src[k]!==undefined).map(k=>`${NOME_CAMPO[k]} → ${valorTxt(k,src[k])}`).join('; ')||'(nenhum campo)';
}
function descOp(o){
  const meta=state.metas.find(m=>m.id===o.id),acao=state.acoes.find(a=>a.id===o.id);
  switch(o.op){
    case'definir_areas':return`Áreas em foco: ${(Array.isArray(o.areas)?o.areas:[]).join(', ')||'(nenhuma)'}`;
    case'definir_visao':return`Visão de futuro: "${tx(o.texto)}"`;
    case'definir_recompensa':return`Recompensa: "${tx(o.texto)}"`;
    case'editar_meta':return`Editar ${meta?rotMeta(meta.id):'meta inexistente'}: ${listaCampos(o,'meta')}`;
    case'nova_meta':return`Nova meta: "${tx(o.texto)}"`+(o.medida?` · medir: ${tx(o.medida)}`:'')+(o.alvo?` · alvo: ${tx(o.alvo)}`:'');
    case'remover_meta':return`Remover ${meta?rotMeta(meta.id)+': "'+meta.texto+'"':'meta inexistente'}`;
    case'editar_acao':return`Editar ação ${acao?'"'+acao.texto+'"':'inexistente'}: ${listaCampos(o,'acao')}`;
    case'nova_acao':{const f=String(o.freq||'diaria').startsWith('sem');return`Nova ação: "${tx(o.texto)}" · ${f?'toda '+valorTxt('dia',o.dia).toLowerCase():'todo dia'}${o.hora?' às '+o.hora:''}${o.dur?' ('+o.dur+' min)':''} · ${o.meta?(state.metas.some(m=>m.id===o.meta)?rotMeta(o.meta):'nova meta "'+o.meta+'"'):'sem meta'}`}
    case'remover_acao':return`Remover ação ${acao?'"'+acao.texto+'"':'inexistente'}`;
    case'editar_base':return`Base: ${listaCampos(o,'base')}`;
    case'editar_blocos':return`Blocos de apoio: ${listaCampos(o,'blocos')}`;
  }
  return`Operação desconhecida "${o.op}"`;
}
function aplicarOp(o,refs){
  switch(o.op){
    case'definir_areas':{
      if(!Array.isArray(o.areas))throw'lista de áreas ausente';
      const ar=[...new Set(o.areas.map(tx).filter(Boolean))].slice(0,8);
      ar.forEach(a=>{if(!AREAS.concat(state.areasExtra).includes(a))state.areasExtra.push(a)});
      state.areas=ar;return}
    case'definir_visao':state.visao=converter('s',o.texto);return;
    case'definir_recompensa':state.recompensa=converter('s',o.texto);return;
    case'editar_meta':{const m=state.metas.find(x=>x.id===o.id);if(!m)throw'meta não encontrada';Object.assign(m,camposDe(o,'meta',refs));return}
    case'nova_meta':{
      if(state.metas.length>=3)throw'o plano já tem 3 metas';
      const c=camposDe(o,'meta',refs);if(!c.texto)throw'meta sem texto';
      const m={id:uid(),texto:'',medida:'',alvo:'',soDeMim:true,...c};state.metas.push(m);if(o.ref)refs[o.ref]=m.id;return}
    case'remover_meta':{const i=state.metas.findIndex(x=>x.id===o.id);if(i<0)throw'meta não encontrada';state.metas.splice(i,1);state.acoes.forEach(a=>{if(a.meta===o.id)a.meta=''});return}
    case'editar_acao':{const a=state.acoes.find(x=>x.id===o.id);if(!a)throw'ação não encontrada';Object.assign(a,camposDe(o,'acao',refs));return}
    case'nova_acao':{
      const c=camposDe(o,'acao',refs);if(!c.texto)throw'ação sem texto';
      state.acoes.push({id:uid(),meta:'',texto:'',freq:'diaria',dia:1,hora:'07:00',dur:30,...c});return}
    case'remover_acao':{const i=state.acoes.findIndex(x=>x.id===o.id);if(i<0)throw'ação não encontrada';state.acoes.splice(i,1);return}
    case'editar_base':{const c=camposDe(o,'base',refs);if(!Object.keys(c).length)throw'nenhum campo';Object.assign(state.base,c);return}
    case'editar_blocos':{const c=camposDe(o,'blocos',refs);if(!Object.keys(c).length)throw'nenhum campo';Object.assign(state.blocos,c);return}
  }
  throw'operação desconhecida';
}
function extrairJSON(t){
  t=String(t||'').trim();if(!t)throw'Cole a resposta da IA no campo acima.';
  const f=/```(?:json)?\s*([\s\S]*?)```/i.exec(t);let s=f?f[1]:t;
  const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)throw'Não encontrei um JSON na resposta. Confira se copiou a resposta inteira da IA.';
  let o;try{o=JSON.parse(s.slice(a,b+1))}catch(e){throw'O JSON da resposta está incompleto ou malformado. Peça à IA: "reenvie só o JSON, válido".'}
  if(!o||typeof o!=='object'||Array.isArray(o))throw'A resposta não segue o formato pedido.';
  const alt=Array.isArray(o.alteracoes)?o.alteracoes.filter(x=>x&&typeof x==='object'&&typeof x.op==='string'):[];
  const prob=Array.isArray(o.problemas)?o.problemas.filter(x=>x&&typeof x==='object').map(x=>({gravidade:['alta','media','baixa'].includes(String(x.gravidade).toLowerCase().replace('é','e'))?String(x.gravidade).toLowerCase().replace('é','e'):'media',onde:tx(x.onde),descricao:tx(x.descricao),regra:tx(x.regra)})):[];
  const perg=Array.isArray(o.perguntas)?o.perguntas.map(tx).filter(Boolean):[];
  if(!alt.length&&!prob.length&&!tx(o.diagnostico))throw'A resposta não tem diagnóstico, problemas nem alterações no formato esperado.';
  return{diagnostico:tx(o.diagnostico),problemas:prob,perguntas:perg,alteracoes:alt};
}
function lerResposta(){
  const err=document.getElementById('ia-erro');
  try{
    const d=extrairJSON(ui.respTxt);
    ui.imp={...d,sel:d.alteracoes.map(o=>!!OPS[o.op])};ui.aplicado=null;
    state.auditoria={data:hoje(),foco:ui.ia.foco,diagnostico:d.diagnostico,problemas:d.problemas,perguntas:d.perguntas};
    agendar();renderAba();
    const el=document.getElementById('ia-revisar');if(el)el.scrollIntoView({block:'start',behavior:'smooth'});
  }catch(e){err.textContent=typeof e==='string'?e:'Não foi possível ler a resposta.'}
}
function aplicarImportacao(){
  if(!ui.imp)return;
  const antes=JSON.parse(JSON.stringify(state)),refs={},ok=[],falhas=[];
  ui.imp.alteracoes.forEach((o,i)=>{
    if(!ui.imp.sel[i])return;
    const d=descOp(o);
    try{aplicarOp(o,refs);ok.push(d)}catch(e){falhas.push(d+' (ignorada: '+(typeof e==='string'?e:'erro')+')')}
  });
  ui.desfazer=antes;ui.aplicado={ok,falhas};ui.imp=null;ui.respTxt='';
  state.exemplo=false;agendar();render();
  const el=document.getElementById('ia-revisar');if(el)el.scrollIntoView({block:'start',behavior:'smooth'});
}
function desfazerImportacao(){
  if(!ui.desfazer)return;state=normalizar(ui.desfazer);ui.desfazer=null;ui.aplicado=null;agendar();render();
}

const GRAV={alta:'Alta',media:'Média',baixa:'Baixa'};
function htmlAuditoria(a){

const alertasTxt=na=>na?na+' alerta'+(na>1?'s':'')+' incluído'+(na>1?'s':'')+' no prompt':'Nenhum alerta';
function atualizarIA(){
  const ta=document.getElementById('ia-txt');if(!ta)return;

function copiarIA(){
  const ta=document.getElementById('ia-txt'),msg=document.getElementById('ia-msg'),t=textoIA();ta.value=t;
  const falha=()=>{ta.closest('details').open=true;ta.focus();ta.select();msg.textContent='Não foi possível copiar automaticamente. O prompt está selecionado: copie com Ctrl+C (ou Cmd+C).'};
  try{navigator.clipboard.writeText(t).then(()=>{msg.textContent='Prompt copiado. Cole numa conversa nova com a IA e traga a resposta para o passo 2.'},falha)}catch(_){falha()}
}

function abaRevisao(){
  const h=hoje(),wAtual=semanaDe(h);
  let grade='<span></span>'+['S','T','Q','Q','S','S','D'].map((_,i)=>`<span class="cab">${DIAS[parse(addDias(state.inicio,i)).getDay()]}</span>`).join('')+'<span></span>';
  for(let w=1;w<=12;w++){
    const d0=addDias(state.inicio,(w-1)*7),sc=scoreSemana(w);
    grade+=`<span class="lbl${w===wAtual?' atual':''}">S${pad(w)} · ${fmt(d0)}</span>`;
    for(let i=0;i<7;i++){const d=addDias(d0,i);
      if(d>h)grade+=`<span class="cel fut" title="${fmt(d)}"></span>`;
      else{const p=scoreDia(d).p;grade+=`<span class="cel${d===h?' hoje':''}" title="${fmt(d)}: ${pct(p)}" style="${p>0?'background:'+corScore(p):''}"></span>`}}
    grade+=`<span class="pct${w===wAtual?' atual':''}">${pct(sc)}</span>`;
  }
  const semanas=[];
  for(let w=1;w<=12;w++){
    const d0=addDias(state.inicio,(w-1)*7),d6=addDias(d0,6);
    if(d0>h&&w!==1)continue;
    const r=state.revisoes[w]||{},sc=scoreSemana(w);
    semanas.push(`<details class="sem" ${w===(wAtual||1)?'open':''}><summary><b>Semana ${w} · ${fmt(d0)} a ${fmt(d6)}</b><span class="mono">${pct(sc)}</span></summary><div class="corpo">
      <label class="campo"><span>O que funcionou</span><textarea id="f-rok-${w}" data-bind="revisoes.${w}.ok">${esc(r.ok)}</textarea></label>
      <label class="campo"><span>O que ajustar na próxima semana</span><textarea id="f-raj-${w}" data-bind="revisoes.${w}.ajuste">${esc(r.ajuste)}</textarea></label>
    </div></details>`);
  }
  return`
  <section>
    <h2>Placar do ciclo</h2>
    <p class="intro">Cada quadrado é um dia: a cor mostra quanto do checklist foi cumprido. A porcentagem à direita é a média da semana até hoje.</p>
    <div class="grade-wrap"><div class="grade">${grade}</div></div>
    <div class="leg"><span><i style="background:var(--line)"></i>nada</span><span><i style="background:${corScore(.5)}"></i>metade</span><span><i style="background:${corScore(1)}"></i>tudo</span><span><i style="box-shadow:inset 0 0 0 1px var(--line)"></i>ainda não chegou</span></div>
  </section>
  <section>
    <h2>Revisão semanal</h2>
    <p class="intro">Reserve 15 minutos no fim de cada semana: olhe o placar, anote o que funcionou e o que muda.</p>
    ${semanas.join('')}
  </section>
  ${blocoIA()}`;
}

function setPath(path,v){
  const ks=path.split('.');let o=state;
  for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}
  o[ks[ks.length-1]]=v;
}
function aoEditar(el){
  if(!el.dataset.bind)return;
  if(el.dataset.lazy!==undefined&&el.type!=='text'&&el.value==='')return;
  let v=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.num!==undefined)v=Number(v)||0;
  if(el.dataset.bind==='inicio'&&!v)return;
  setPath(el.dataset.bind,v);
  if(state.exemplo)state.exemplo=false,document.getElementById('faixa').innerHTML='';
  agendar();
  if(el.dataset.lazy!==undefined){ui.rotinaSuja=true;renderTopo();return}
  if(el.dataset.refaz!==undefined||el.type==='checkbox'||el.dataset.bind==='inicio'){if(el.dataset.bind==='inicio')ui.dia=null;render();return}
  atualizarDerivados();
}

  if(a==='bk-aplicar'){aplicarBackup();return}
  if(a==='bk-cancelar'){ui.bk=null;renderAba();irPara('bk-imp');return}
  if(a==='bk-desfazer'){desfazerBackup();return}
  if(a==='bk-fechar'){ui.bkFeito=false;ui.bkDesfazer=null;renderAba();return}
  state.exemplo=false;
  if(a==='area'){const v=t.dataset.v,i=state.areas.indexOf(v);i<0?state.areas.push(v):state.areas.splice(i,1)}
  if(a==='add-area'){const inp=document.getElementById('nova-area'),v=(inp.value||'').trim();if(!v)return;if(!AREAS.concat(state.areasExtra).includes(v))state.areasExtra.push(v);if(!state.areas.includes(v))state.areas.push(v)}
  if(a==='add-meta'&&state.metas.length<3)state.metas.push({id:uid(),texto:'',medida:'',alvo:'',soDeMim:true});
  if(a==='del-meta'){const m=state.metas.splice(+t.dataset.i,1)[0];if(m)state.acoes.forEach(x=>{if(x.meta===m.id)x.meta=''})}
  if(a==='add-acao')state.acoes.push({id:uid(),meta:state.metas[0]?state.metas[0].id:'',texto:'',freq:'diaria',dia:1,hora:'07:00',dur:60});
  if(a==='del-acao')state.acoes.splice(+t.dataset.i,1);
  agendar();render();
});

/* Reordena a rotina só quando o foco sai da linha editada, sem engolir cliques */
let ptrDown=false;
const refazDepois=()=>setTimeout(()=>{if(ui.rotinaSuja)rebuildRotina(document.activeElement&&document.activeElement.id)},0);
document.addEventListener('pointerdown',()=>{ptrDown=true},true);
document.addEventListener('pointercancel',()=>{ptrDown=false},true);
document.addEventListener('pointerup',()=>{ptrDown=false;if(ui.refazUp){ui.refazUp=false;refazDepois()}},true);
document.addEventListener('focusout',e=>{
  if(!ui.rotinaSuja)return;
  const li=e.target.closest&&e.target.closest('.ev');if(!li)return;
  if(e.relatedTarget&&li.contains(e.relatedTarget))return;
  if(ptrDown){ui.refazUp=true;return}
  refazDepois();
});

/* ---------- Início ---------- */
state=lerLocal()||exemplo();
const ABAS=['hoje','plano','base','rotina','revisao','guia'];
let abaSalva=null;try{abaSalva=localStorage.getItem(LS+'-aba')}catch(_){}
if(abaSalva&&ABAS.includes(abaSalva))ui.aba=abaSalva;else if(state.exemplo)ui.aba='guia';
const hash=(location.hash||'').slice(1);if(ABAS.includes(hash))ui.aba=hash;
render();

(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!user||!db)return;
    const id=await user.id();if(!id)return;
    const r=db.doc('data/users/'+id+'/caverna');
    const snap=await r.get();
    ref=r;
    if(snap.exists&&snap.data()&&snap.data().state){
      state=normalizar(snap.data().state);gravarLocal();ui.dia=null;setStatus('Salvo na sua conta');render();
    }else{
      setStatus(state.exemplo?'Conectado à sua conta':'Salvando…');render();
      if(!state.exemplo)persistir();
    }
  }catch(e){ref=null}
})();
